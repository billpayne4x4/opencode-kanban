<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="OpenCode Kanban logo">
  <title>OpenCode Kanban</title>
  <desc>A three-column kanban board. The first column holds finished cards including one ticked; the second holds an active card; the third holds waiting cards. An amber restart arrow above the board marks the nudge engine.</desc>

  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- nudge: restart arrow, centred above the board -->
  <path d="M69.6 9.2 A8.6 8.6 0 1 1 58.8 9.2" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M53.4 6.2 L58.9 9.3 L53.7 13" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- board -->
  <rect x="6" y="32" width="116" height="78" rx="14" fill="url(#board)" stroke="#334155" stroke-width="2" />

  <!-- column wells -->
  <rect x="16" y="44" width="28" height="54" rx="7" fill="#172033" />
  <rect x="50" y="44" width="28" height="54" rx="7" fill="#172033" />
  <rect x="84" y="44" width="28" height="54" rx="7" fill="#172033" />

  <!-- column headers -->
  <rect x="22" y="50" width="16" height="4" rx="2" fill="#22c55e" />
  <rect x="56" y="50" width="16" height="4" rx="2" fill="#3b82f6" />
  <rect x="90" y="50" width="16" height="4" rx="2" fill="#64748b" />

  <!-- done column: two finished cards, both ticked -->
  <rect x="21" y="60" width="18" height="15" rx="4" fill="#22c55e" />
  <path d="M25 67.5 L28.3 70.8 L34 63.8" fill="none" stroke="#052e16" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="21" y="79" width="18" height="15" rx="4" fill="#16a34a" opacity="0.5" />
  <path d="M25 86.5 L28.3 89.8 L34 82.8" fill="none" stroke="#052e16" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- active column: the card in flight, then a waiting one -->
  <rect x="55" y="60" width="18" height="15" rx="4" fill="url(#active)" />
  <rect x="58" y="65" width="12" height="2.4" rx="1.2" fill="#0b1220" opacity="0.55" />
  <rect x="58" y="69.5" width="8" height="2.4" rx="1.2" fill="#0b1220" opacity="0.32" />
  <rect x="55" y="79" width="18" height="15" rx="4" fill="#334155" />

  <!-- waiting column -->
  <rect x="89" y="60" width="18" height="15" rx="4" fill="#475569" />
  <rect x="92" y="65" width="12" height="2.4" rx="1.2" fill="#94a3b8" opacity="0.45" />
  <rect x="89" y="79" width="18" height="15" rx="4" fill="#475569" />
  <rect x="92" y="84" width="12" height="2.4" rx="1.2" fill="#94a3b8" opacity="0.45" />
</svg>